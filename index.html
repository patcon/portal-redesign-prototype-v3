<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" />
    <title>Routing — one DO per chat</title>
    <!--
      Applied before first paint, so a dark-mode reload never flashes light. shadcn
      swaps its palette on a `dark` class rather than an attribute, which is why this
      touches `classList` — `ModeToggle` writes the same two things back.
    -->
    <script>
      (() => {
        const mode = localStorage.getItem("theme") || "light";
        document.documentElement.classList.toggle("dark", mode === "dark");
        document.documentElement.style.colorScheme = mode;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client.tsx"></script>
  </body>
</html>
